[nfsd]
threads=8
vers3=n
vers4.0=n
vers4.1=y
vers4.2=y
# Every metadata server restart blocks all pNFS clients for the grace period
# (90 s by default); 15 s bounds that stall. Clients renew every ~15 s instead.
lease-time=15
grace-time=15

[mountd]
manage-gids=n

[nfsdcld]
# nfs-utils is built with its state directory on /run, but the client
# recovery database has to survive a guest restart: keep it on the state disk.
storagedir=/var/lib/nfs/nfsdcld
